name: context-crafter
version: 1.0.0
description: "Turn any repository into compact, truthful AI-agent context: overviews, repo maps, dependency graphs, and architecture notes."
providers:
- claude
- codex
- kimi
surfaces:
  skills:
  - name: crafter:using-context-crafter
    path: skills/using-context-crafter/SKILL.md
  - name: crafter:onboard-repo
    path: skills/onboard-repo/SKILL.md
  commands:
  - name: context-map
    path: commands/context-map.md
    providers:
    - claude
    - kimi
  agents: []
  hooks: []
  mcp:
  - name: context-crafter
    transport: stdio
    package: module:context_crafter_mcp.server
    env: []
    args: []
install:
  claude: ~/.claude/plugins/context-crafter/
  codex: ~/.codex/plugins/context-crafter/
  kimi: ~/.kimi-code/plugins/managed/context-crafter/
settings_patches: {}
marketplace: {}
metadata:
  author: 0langa
  license: MIT
  homepage: https://github.com/0langa/context-crafter-mcp
  repository: https://github.com/0langa/context-crafter-mcp
  keywords:
  - mcp
  - documentation
  - static-analysis
  - ai-agents
  - repository-tools
  interface:
    display_name: Context Crafter
    short_description: Compact, truthful repository context for coding agents.
    long_description: Context Crafter statically analyses a repository and generates
      a compact context bundle - project overview, repo map, dependency graph, architecture
      summary, agent brief, and a machine-readable evidence ledger - so a coding agent
      can orient in an unfamiliar codebase without reading every file.
    developer_name: 0langa
    category: Productivity
    capabilities:
    - Read
    - Local
    website_url: https://github.com/0langa/context-crafter-mcp
    default_prompt:
    - Map this repository so you understand its layout.
    - Generate an agent context bundle for this repo.
  session_start_skill: crafter:using-context-crafter
  skill_instructions: Use Context Crafter for static repository orientation only.
    It never executes target-repo code. Treat generated claims at their stated evidence
    level and never upgrade an inferred claim to an observed one.
provider_extras:
  claude:
    defaultEnabled: true
  codex: {}
  kimi: {}
options:
  shared_mcp_file: false
